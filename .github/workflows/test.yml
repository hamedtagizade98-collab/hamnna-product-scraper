name: Hamnna Scraper Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, json
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*')
          test -n "$files"
          while IFS= read -r file; do
            php -l "$file"
          done <<< "$files"

      - name: Price parser regression tests
        run: php tests/test-price-parser.php

      - name: Security/static checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules \
            -E 'eval[[:space:]]*\(|assert[[:space:]]*\(|base64_decode[[:space:]]*\([^)]*\)[[:space:]]*\(' .
          grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules "ABSPATH" .
          grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules "wp_remote_get" .
          grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules "current_user_can" .

  structure-and-config:
    name: Plugin structure and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test-price-parser.php
          test -f includes/class-hamnna-scraper.php
          grep -RIn "3\*HOUR_IN_SECONDS\|3 \* HOUR_IN_SECONDS" includes . --exclude-dir=.git
          grep -RIn "hamnna_3hours" includes . --exclude-dir=.git
          grep -RIn "SOURCE_HOST.*hamnna\.ir\|hamnna\.ir.*SOURCE_HOST" includes . --exclude-dir=.git
          grep -RIn "skip_existing" includes . --exclude-dir=.git
          grep -RIn "availability" includes/class-hamnna-scraper.php
