name: Hamnna Scraper Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.2','8.3','8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom,mbstring,json
          coverage: none
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*')
      - name: Price parser regression tests
        run: php tests/test-price-parser.php
      - name: Static security checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules -E 'eval[[:space:]]*\(|assert[[:space:]]*\(|base64_decode[[:space:]]*\(' .
          grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'ABSPATH' .
          grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'wp_remote_get' .
          grep -RIn --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'current_user_can' .
  scraper-contract:
    name: Scraper feature contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required features
        shell: bash
        run: |
          set -euo pipefail
          test -f includes/class-hamnna-scraper.php
          grep -q "hamnna_10min" includes/class-hamnna-scraper.php
          grep -q "10\*MINUTE_IN_SECONDS" includes/class-hamnna-scraper.php
          grep -q "ensure_schedule" includes/class-hamnna-scraper.php
          grep -q "hamnna_price_sync" includes/class-hamnna-scraper.php
          grep -q "sync_prices" includes/class-hamnna-scraper.php
          grep -q "_hamnna_source_url" includes/class-hamnna-scraper.php
          grep -q "set_regular_price" includes/class-hamnna-scraper.php
          grep -q "set_price" includes/class-hamnna-scraper.php
          grep -q "skip_existing" includes/class-hamnna-scraper.php
          grep -q "availability" includes/class-hamnna-scraper.php
          grep -q "SOURCE_HOST.*hamnna.ir" includes/class-hamnna-scraper.php
          grep -q "۱۸۰.۰۰۰ تومان" includes/class-hamnna-scraper.php
          grep -q "به‌روزرسانی قیمت‌ها" includes/class-hamnna-scraper.php
